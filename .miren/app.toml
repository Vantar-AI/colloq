name = "colloq-example-generate"

[build]
dockerfile = ".miren/Dockerfile.colloq"

[[env]]
key = "COLLOQ_PLAN_IDENTITY"
value = "sha256:5d66c5bdc25454b7542021da3d5c73ff05d4d3757f1ae90738189799d18f10d1"

[[env]]
key = "COLLOQ_CONVERSATION_IDENTITY"
value = "sha256:41c84488dc95551605671ea78046cad98bbdeb9c3ede1d73d7303b6f50a7c0d4"

[[env]]
key = "COLLOQ_NODE_IDENTITY_JSON"
required = true
sensitive = true
description = "Local Colloq node identity JSON; contains the Iroh private key."

[[env]]
key = "COLLOQ_AUTHORIZATION_JSON"
required = true
sensitive = true
description = "Exact peer/role/plan authorization policy JSON."

[[env]]
key = "COLLOQ_ADVERTISE_ADDRESS"
required = true
sensitive = false
description = "Public or overlay socket address advertised in the endpoint ticket."

[services.server]
command = "/bin/colloq serve-iroh /etc/colloq/conversation.json --identity /run/colloq/server.colloqnode.json --policy /run/colloq/server.authorization.json --listen 0.0.0.0:7880 --ticket-out /tmp/server.colloqendpoint.json --tokens 3 --wire compact"

[[services.server.ports]]
port = 7880
name = "colloq"
type = "udp"
node_port = 7880

[services.server.concurrency]
mode = "fixed"
num_instances = 1
shutdown_timeout = "10s"
