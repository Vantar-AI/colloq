[package]
name = "colloq"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Experimental graph-native conversation language for distributed AI systems"
license = "Apache-2.0"
repository = "https://github.com/Vantar-AI/colloq"
publish = false

[lib]
name = "colloq"
path = "src/lib.rs"

[[bin]]
name = "colloq"
path = "src/main.rs"

[dependencies]
automerge = "0.10.0"
clap = { version = "4", features = ["derive"] }
iroh = { version = "1.0.3", default-features = false, features = ["tls-ring"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread"] }
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
