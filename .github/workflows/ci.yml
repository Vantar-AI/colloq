name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [1.91.0, stable]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run tests
        run: cargo test --locked --all-features

  quality:
    name: Formatting, lint, and release build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release

  schemas:
    name: Schemas and generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JSON Schema validator
        run: python -m pip install check-jsonschema==0.37.4

      - name: Validate schemas against their metaschema
        run: |
          for schema in spec/*.schema.json; do
            check-jsonschema --check-metaschema "$schema"
          done

      - name: Validate checked-in examples
        run: |
          check-jsonschema --schemafile spec/colloq-graph-v0.schema.json examples/hello.colloqgraph.json
          check-jsonschema --schemafile spec/colloq-conversation-v0.schema.json \
            examples/generate.colloqconv.json examples/draft-sync.colloqconv.json \
            examples/route.colloqconv.json
          check-jsonschema --schemafile spec/colloq-jev-v0.schema.json \
            examples/route.colloqjev.json
          check-jsonschema --schemafile spec/colloq-session-v0.schema.json \
            examples/session-preface.compact.json
          check-jsonschema --schemafile spec/colloq-evidence-v0.schema.json \
            benchmarks/evidence-v0-example.json

      - name: Validate generated plans and trust artifacts
        run: |
          cargo run --locked -- compile --out build/generate.colloqplan.json
          check-jsonschema --schemafile spec/colloq-plan-v0.schema.json build/generate.colloqplan.json
          cargo run --locked -- bootstrap-two-node --out build/two-node
          check-jsonschema --schemafile spec/colloq-node-v0.schema.json \
            build/two-node/server.colloqnode.json build/two-node/client.colloqnode.json
          check-jsonschema --schemafile spec/colloq-authorization-v0.schema.json \
            build/two-node/server.authorization.json build/two-node/client.authorization.json
          cargo run --locked -- run-plan build/generate.colloqplan.json --wire compact --transport memory

  two-node:
    name: Two-node Iroh smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Colloq
        run: cargo build --locked

      - name: Exercise independent authenticated processes
        run: scripts/two-node-smoke.sh
